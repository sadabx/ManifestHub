<!DOCTYPE html>
<html lang="en">

<head>

    <title>404 - Lost Like Zoro | ManifestHub</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/base.css?v=1.0" />
    <link rel="stylesheet" href="/css/components.css?v=1.1" />
    <link rel="stylesheet" href="/css/error.css?v=1.1" />

<body>
    <nav class="site-nav" aria-label="ManifestHub navigation">
        <a class="site-nav-brand" href="/" aria-label="ManifestHub home">

        <div class="site-nav-right">
            <div class="site-nav-links">
                <a class="site-nav-link" href="/">
