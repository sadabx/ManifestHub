name: Roll Up Daily Downloads

on:
  schedule:
    - cron: '18 16 */3 * *' # Every 3 days at 10:18 PM Asia/Dhaka / 16:18 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  rollup-downloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Roll up Supabase download events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/update-trending.js

      - name: Commit and Push Changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/download-counts.json data/download-rollup-state.json data/trending-data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update trending downloads"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Changes pushed successfully."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in trending data."
          fi

      - name: Delete processed Supabase events
        if: steps.commit.outputs.pushed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/update-trending.js --cleanup-processed
